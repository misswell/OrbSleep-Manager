name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.5)"
        required: true
        default: "v0.1.5"
        type: string
      ref:
        description: "Optional git ref to build (defaults to the tag)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish/update the GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release version and credentials
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/MARKETING_VERSION:/ {print $2; exit}' app/project.yml)"
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Tag $RELEASE_TAG does not match app MARKETING_VERSION v$version" >&2
            exit 1
          }
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ID \
                      APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
                      APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing secret $name" >&2; exit 1; }
          done
          echo "Preparing $RELEASE_TAG ($version)"

      - name: Install Go and XcodeGen
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: core/go.sum

      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen

      - name: Run Go format, vet and race tests
        shell: bash
        run: |
          set -euo pipefail
          cd core
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/orbsleep-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          p12="$RUNNER_TEMP/developer-id.p12"
          cleanup() { rm -f "$p12"; }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning | grep -F "$APPLE_DEVELOPER_ID"

          printf '%s' "$keychain_password" > "$RUNNER_TEMP/keychain-password"
          chmod 600 "$RUNNER_TEMP/keychain-password"
          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "SIGNING_KEYCHAIN_PASSWORD_FILE=$RUNNER_TEMP/keychain-password"
          } >> "$GITHUB_ENV"

      - name: Write notarization API key
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 -D > "$key"
          chmod 600 "$key"
          echo "APP_STORE_CONNECT_PRIVATE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, package
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$(cat "$SIGNING_KEYCHAIN_PASSWORD_FILE")" "$SIGNING_KEYCHAIN"
          ./scripts/package-release.sh

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/MARKETING_VERSION:/ {print $2; exit}' app/project.yml)"
          app="dist/OrbSleepManager-$version-macos-universal/OrbSleepManager.app"
          dmg="dist/OrbSleepManager-$version-macos-universal.dmg"
          zip="dist/OrbSleepManager-$version-macos-universal.zip"
          [[ -d "$app" && -f "$dmg" && -f "$zip" ]]
          validate_staple() {
            local target="$1"
            for _ in 1 2 3; do
              if xcrun stapler validate "$target"; then return 0; fi
              sleep 5
            done
            echo "::warning::stapler validate failed after retries for $target (ticket was stapled; spctl is authoritative)"
            return 0
          }
          codesign --verify --deep --strict "$app"
          for tool in orbsleepd orbsleepctl; do
            codesign --verify --strict "$app/Contents/Resources/$tool"
            codesign --display --verbose=4 "$app/Contents/Resources/$tool" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            lipo -archs "$app/Contents/Resources/$tool" | grep -q arm64
            lipo -archs "$app/Contents/Resources/$tool" | grep -q x86_64
          done
          codesign --display --verbose=4 "$app" 2>&1 | grep -F "Authority=Developer ID Application"
          codesign --display --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          spctl --assess --type execute --verbose "$app"
          validate_staple "$app"
          validate_staple "$dmg"
          [[ -f "$app/Contents/Library/LaunchAgents/com.misswell.orbsleep.daemon.app.plist" ]]
          /usr/libexec/PlistBuddy -c 'Print :BundleProgram' \
            "$app/Contents/Library/LaunchAgents/com.misswell.orbsleep.daemon.app.plist" \
            | grep -q 'Contents/Resources/orbsleepd'
          lipo -archs "$app/Contents/MacOS/OrbSleepManager" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/OrbSleepManager" | grep -q x86_64
          lipo -archs "$app/Contents/Resources/orbsleepd" | grep -q arm64
          lipo -archs "$app/Contents/Resources/orbsleepd" | grep -q x86_64
          rm -rf /tmp/orbsleep-dmg
          hdiutil attach "$dmg" -nobrowse -quiet -mountpoint /tmp/orbsleep-dmg
          test ! -e /tmp/orbsleep-dmg/bin
          test -d /tmp/orbsleep-dmg/OrbSleepManager.app
          hdiutil detach /tmp/orbsleep-dmg -quiet || true
          rm -rf /tmp/orbsleep-dmg

          # Verify the ZIP and DMG actually contain the stapled, signed app.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ditto -x -k "$zip" "$tmp/zip"
          codesign --verify --deep --strict "$tmp/zip/OrbSleepManager-$version-macos-universal/OrbSleepManager.app"
          validate_staple "$tmp/zip/OrbSleepManager-$version-macos-universal/OrbSleepManager.app"
          spctl --assess --type execute --verbose "$tmp/zip/OrbSleepManager-$version-macos-universal/OrbSleepManager.app"

          mkdir -p "$tmp/mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$tmp/mount" "$dmg" >/dev/null
          codesign --verify --deep --strict "$tmp/mount/OrbSleepManager.app"
          validate_staple "$tmp/mount/OrbSleepManager.app"
          spctl --assess --type execute --verbose "$tmp/mount/OrbSleepManager.app"
          hdiutil detach "$tmp/mount" >/dev/null

          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbSleepManager-${{ inputs.tag || github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS

      - name: Verify tag matches source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          described="$(git describe --tags --exact-match HEAD)"
          [[ "$described" == "$RELEASE_TAG" ]] || {
            echo "::error::Tag $RELEASE_TAG does not point at checked-out HEAD ($described)"
            exit 1
          }

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/MARKETING_VERSION:/ {print $2; exit}' app/project.yml)"
          dmg="dist/OrbSleepManager-$version-macos-universal.dmg"
          zip="dist/OrbSleepManager-$version-macos-universal.zip"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg" "$zip" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$dmg" "$zip" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "OrbSleep Manager $RELEASE_TAG" --generate-notes
          fi

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -e "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "${SIGNING_KEYCHAIN_PASSWORD_FILE:-}" "${APP_STORE_CONNECT_PRIVATE_KEY_PATH:-}"
          security list-keychains -d user -s login.keychain-db /Library/Keychains/System.keychain || true
