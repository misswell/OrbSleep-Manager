name: OrbSleepManager
options:
  minimumXcodeGenVersion: "2.40.0"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: U8U443D7ZL
    MARKETING_VERSION: 0.1.8
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  OrbSleepManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OrbSleep Manager
        CFBundleName: OrbSleep Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationSupportsSecureRestorableState: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright © 2026 Guofeng Liu. All rights reserved."
        NSPrincipalClass: NSApplication
    entitlements:
      path: OrbSleepManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.orbsleepmanager
        PRODUCT_NAME: OrbSleepManager
        PRODUCT_MODULE_NAME: OrbSleepManager
        MARKETING_VERSION: 0.1.8
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U8U443D7ZL
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
schemes:
  OrbSleepManager:
    build:
      targets:
        OrbSleepManager: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
